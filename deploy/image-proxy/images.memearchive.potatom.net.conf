# Vhost для images.memearchive.potatom.net.
# После установки certbot --nginx добавит сюда listen 443, сертификат и редирект с 80.
server {
    listen 80;
    listen [::]:80;
    server_name images.memearchive.potatom.net;

    location ^~ /image/ {
        proxy_pass https://memearchive.potatom.net;
        proxy_http_version 1.1;
        proxy_set_header Host memearchive.potatom.net;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_ssl_name memearchive.potatom.net;
        proxy_cache meme_images;
        proxy_cache_key "$scheme$host$uri";
        proxy_cache_valid 200 30d;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        proxy_ignore_headers Set-Cookie;
        add_header X-Cache-Status $upstream_cache_status;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        limit_except GET HEAD { deny all; }
    }

    location / {
        return 404;
    }
}

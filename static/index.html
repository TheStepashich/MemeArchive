<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meme Archive // POTATOM</title>
    <link rel="icon" href="/static/plogo_nbg_64.png" type="image/png">
    <meta name="description" content="Семантический архив мемов: описания, теги и семантический поиск по смыслу.">
    <meta name="keywords" content="мем, мемы, архив мемов, семантический поиск, теги">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://memearchive.potatom.net/">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Meme Archive">
    <meta property="og:title" content="Meme Archive // POTATOM">
    <meta property="og:description" content="Семантический архив мемов: описания, теги и семантический поиск по смыслу.">
    <meta property="og:url" content="https://memearchive.potatom.net/">
    <meta property="og:locale" content="ru_RU">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Meme Archive // POTATOM">
    <meta name="twitter:description" content="Семантический архив мемов: описания, теги и семантический поиск по смыслу.">
    <meta name="twitter:url" content="https://memearchive.potatom.net/">
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Meme Archive",
      "url": "https://memearchive.potatom.net/",
      "inLanguage": "ru-RU"
    }
    </script>
    <link rel="stylesheet" href="/static/css/acid.css">
    <link rel="stylesheet" href="/static/css/index.css">
</head>
<body>

<header class="header">
    <a href="/" class="logo">MEME<span>_ARCHIVE</span></a>
    <button id="searchToggle" class="search-toggle" type="button" aria-label="Поиск" title="Поиск">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <circle cx="10" cy="10" r="6" fill="none" stroke="currentColor" stroke-width="3"/>
            <line x1="15" y1="15" x2="21" y2="21" stroke="currentColor" stroke-width="3"/>
        </svg>
    </button>
    <div id="searchBox" class="search-box">
        <input type="text" id="queryInput" placeholder="ПОИСК МЕМА...">
    </div>
    <button id="addBtn" class="btn-add" type="button">+ <span class="btn-add-label">ЗАГРУЗИТЬ</span></button>
    <button id="themeToggle" class="theme-toggle" type="button">☾ <span class="theme-label">ТЁМНАЯ</span></button>
</header>

<div class="filters-bar">
    <select id="sortSelect" class="sort-select">
        <option value="new">НОВЫЕ ↓</option>
        <option value="old">СТАРЫЕ ↑</option>
        <option value="random">РАНДОМ</option>
    </select>
    <div id="tagsList" class="tags-list"></div>
    <button id="allTagsBtn" class="tag tag-default" type="button">ВСЕ ТЕГИ ▾</button>
</div>

<div id="uploadWrap" class="upload-wrap">
    <div class="upload-form">
        <input id="imageFile" type="file" accept="image/*" />
        <input type="text" id="uploadTagsInput" placeholder="теги через запятую" aria-label="Теги изображения" />
        <div id="captchaRow" class="captcha-row hidden">
            <img id="captchaImage" class="captcha-image" alt="Код проверки" />
            <button id="captchaRefreshBtn" type="button" class="btn captcha-refresh" title="Другой код">&#8635;</button>
            <input type="text" id="captchaInput" placeholder="цифры из фразы" aria-label="Код с картинки" autocomplete="off" spellcheck="false" inputmode="numeric" />
        </div>
        <div class="upload-row">
            <button id="uploadBtn" type="button" class="btn btn-primary">Добавить</button>
            <button id="cancelUploadBtn" type="button" class="btn">Отмена</button>
            <div id="uploadLoader" class="loader hidden" aria-hidden="true"></div>
        </div>
    </div>
</div>

<main class="main">
    <div id="searchMeta" class="feed-meta hidden"></div>
    <div id="results" class="memes-grid" aria-live="polite"></div>
    <div id="feedSentinel" class="load-more hidden">
        <button id="loadMoreBtn" class="btn-load-more" type="button">ЗАГРУЗИТЬ ЕЩЁ &gt;</button>
    </div>
</main>

<div id="toasts" class="toast-container" aria-live="polite"></div>

<script src="/static/js/theme.js"></script>
<script src="/static/js/index.js"></script>

</body>
</html>
